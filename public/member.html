<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIGER GYM</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0a0a;--card:#151515;--tx:#f5f5f5;--mut:#a8a490;--bd:#3a3210;--ac:#ffc107;--act:#111;--ok:#51cf66;--bad:#ff6b6b;--warn:#ffa94d}
.lg{height:48px;border-radius:8px}.big{width:150px;max-width:60%;border-radius:16px}header{border-bottom:2px solid var(--ac)}.pw{font-size:34px;font-weight:800;color:var(--ac)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:1px}.logo b{color:var(--ac)}
.sw a,nav button{padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer;font-family:inherit}
.sw a.on,nav button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
main{padding:8px 16px 40px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{font-size:26px;font-weight:800}.mut{color:var(--mut);font-size:13px}
h2{font-size:17px;margin:4px 0 10px}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
button.b{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--ac);color:var(--act);cursor:pointer;font-weight:600}
button.g{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:13px}
button.d{color:var(--bad);border-color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:3px;min-height:2px}
#reader{width:100%;max-width:320px;margin:8px auto}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}.qr svg{width:220px;height:220px;display:block}
.msg{padding:10px;border-radius:8px;margin:8px 0;font-weight:600;border:1px solid currentColor}
.mem{max-width:420px;margin:auto;text-align:center}
.meter{height:12px;border-radius:8px;background:var(--bd);overflow:hidden}.meter i{display:block;height:100%}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.mc{margin:0}.mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{font:inherit;font-size:14px;padding:7px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.chips button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.qrbig svg{width:300px;height:300px}.pq{background:#fff;color:#000;display:inline-block;padding:18px;border-radius:16px}
@media print{body *{visibility:hidden}#gateprint,#gateprint *{visibility:visible}#gateprint{position:absolute;left:50%;top:20px;transform:translateX(-50%)}}
</style>

<script>
const K='tigergym_v3',CAP=30,MODE='member',LOGO=document.querySelector('.lg').src;const isMem=()=>MODE==='member'||(MODE==='both'&&location.hash==='#member');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((new Date(s)-new Date(today()))/864e5);
let S={plans:[],members:[],att:[],invs:[],reqs:[],notes:[],seen:{},staff:[]};
const save=()=>{};
const GP=new URLSearchParams(location.search).get('g');let pendingG=GP;if(GP){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
let TOK=null;try{TOK=localStorage.getItem('tg_tok')}catch(e){}
const setTok=t=>{TOK=t;try{t?localStorage.setItem('tg_tok',t):localStorage.removeItem('tg_tok')}catch(e){}};
async function api(p,b){let j={},st=0;try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});st=r.status;j=await r.json()}catch(e){j={error:'تعذر الاتصال بالخادم'}}
 if(st===401&&TOK){setTok(null);user=null;me=null;route()}return{ok:st>=200&&st<300,...j}}
async function load(){const r=await api(MODE==='member'?'me':'state');if(r.ok){S=r.state;if(MODE!=='member')user=r.me}return r.ok}
function toast(t,ok){const d=document.createElement('div');d.className='msg '+(ok?'ok':'bad');d.style.cssText='position:fixed;bottom:16px;inset-inline:16px;z-index:9;background:var(--card)';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
async function act(type,data,quiet){const r=await api('act',{type,data});if(r.ok)S=r.state;else toast(r.error||'تعذر تنفيذ العملية');if(!quiet)route();return r}
async function chPw(){const o=$('#po').value,n=$('#pn2').value;if(n.length<6){toast('كلمة السر الجديدة 6 خانات على الأقل');return}const r=await act('pwChange',{old:o,pw:n},1);if(r.ok){$('#po').value='';$('#pn2').value='';toast('تم تغيير كلمة السر',1)}}
const SHAM_IMG='/shamcash.jpg';
function payInfo(){const el=$('#payinfo');if(!el)return;const p=S.plans.find(x=>x.id===($('#rp')||{}).value);
 el.innerHTML=p?`المبلغ المطلوب: <b>${p.price}</b><div style="margin:10px 0 8px;color:var(--tx);font-weight:700">قم بتحويل المبلغ على الحساب التالي</div><img src="${SHAM_IMG}" alt="حساب شام كاش" style="width:100%;max-width:340px;border-radius:12px;background:#fff;display:block;margin:auto">`:''}
const shrink=f=>new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=u});
const readF=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function sendRenew(){const f=$('#rf').files[0];if(!f){toast('أرفق إشعار التحويل');return}
 let proof;try{if(f.type==='application/pdf'){if(f.size>2.4e6){toast('ملف PDF كبير (الحد 2.4 ميغابايت)');return}proof=await readF(f)}else proof=await shrink(f)}catch(e){toast('تعذر قراءة الملف، جرّب ملفاً آخر');return}
 await act('reqRenew',{plan:$('#rp').value,proof})}
async function viewProof(id){try{const r=await fetch('/api/proof/'+id,{headers:{Authorization:'Bearer '+TOK}});if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b),d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000d;z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;cursor:pointer';

 const f=ep?`<div class="card"><h2>${ep==='new'?'باقة جديدة':'تعديل الباقة'}</h2><div class="row"><input id="pn" placeholder="اسم الباقة" value="${esc(e.name)}"><input id="ps" placeholder="الأقسام (جيم، كارديو، سونا...)" value="${esc(e.services)}"><input id="pp" type="number" placeholder="السعر" value="${e.price??''}"><input id="pd" type="number" placeholder="المدة بالأيام" value="${e.days??30}"></div><button class="b" onclick="savePlan()">حفظ</button> <button class="g" onclick="ep=null;route()">إلغاء</button></div>`:'<button class="b" style="margin-bottom:12px" onclick="ep=\'new\';route()">+ باقة جديدة</button>';
 return f+`<div class="grid">${S.plans.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="mut">${esc(p.services)}</div><div class="stat">${p.price}</div><div class="mut">${p.days} يوم · ${S.members.filter(m=>m.plan===p.id).length} عضو</div><button class="g" onclick="ep='${p.id}';route();scrollTo(0,0)">تعديل</button> <button class="g d" onclick="delPlan('${p.id}')">${delP===p.id?'تأكيد الحذف؟':'حذف'}</button></div>`).join('')}</div>`;
}
function savePlan(){const n=$('#pn').value.trim(),pr=+$('#pp').value;if(!n||!pr)return;const id=ep==='new'?null:ep;ep=null;act('planSave',{id,name:n,services:$('#ps').value,price:pr,days:+$('#pd').value||30})}
function delPlan(id){if(delP!==id){delP=id;route();return}delP=null;act('planDel',{id})}
function vNotes(){
 return `<div class="card"><h2>إرسال إشعار</h2><div class="row"><select id="nt"><option value="all">جميع المشتركين (${S.members.length})</option>${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="nh" placeholder="العنوان (مثال: أعمال صيانة)"></div><textarea id="nb" rows="3" placeholder="نص الإشعار"></textarea><br><br><button class="b" onclick="sendNote()">إرسال</button>${msg?`<div class="msg ok">${msg[0]}</div>`:''}</div>
 <div class="card"><h2>الإشعارات المرسلة</h2>${[...S.notes].reverse().map(n=>`<div style="border-bottom:1px solid var(--bd);padding:6px 0"><b>${esc(n.title)}</b> <span class="mut">· ${n.to==='all'?'للجميع':esc(mem(n.to)?.name||n.to)} · ${new Date(n.t).toLocaleString('ar')}</span><div>${esc(n.body)}</div></div>`).join('')||'<span class="mut">لا شيء</span>'}</div>`;
}
async function sendNote(){const h=$('#nh').value.trim(),b=$('#nb').value.trim();if(!h||!b)return;const r=await act('noteSend',{to:$('#nt').value,title:h,body:b},1);msg=r.ok?['تم الإرسال — وصل كإشعار جوال إلى '+r.extra.pushed+' جهاز، والبقية يرونه داخل التطبيق','ok']:null;route()}
function notesHtml(m){
 const mine=S.notes.filter(n=>n.to==='all'||n.to===m.id).reverse(),seen=S.seen[m.id]||0,un=mine.filter(n=>n.id>seen).length,d=diff(m.end);
 let h='';
 if(d<0)h+='<div class="msg bad">اشتراكك منتهي، أرسل طلب تجديد</div>';else if(d<=7)h+=`<div class="msg warn">ينتهي اشتراكك خلال ${d} أيام — جدّد الآن</div>`;
 h+=`<div class="card" style="text-align:right"><h2>🔔 الإشعارات ${un?`<span class="tag warn">${un} جديد</span>`:''}</h2>`+(mine.slice(0,5).map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);${n.id>seen?'border-right:3px solid var(--ac);padding-right:8px':''}"><b>${esc(n.title)}</b> <span class="mut">${new Date(n.t).toLocaleString('ar')}</span><div>${esc(n.body)}</div></div>`).join('')||'<span class="mut">لا توجد إشعارات</span>')+(un?`<br><button class="g" onclick="act('seen',{id:${mine[0]?.id||0}})">تم الاطلاع</button>`:'')+'<br><button class="g" onclick="enablePush()">تفعيل إشعارات الجوال</button></div>';
 return h}
function vFin0(){
 const tot=S.invs.reduce((a,i)=>a+i.amt,0);
 return `<div class="card"><h2>طلبات التجديد</h2>${S.reqs.length?S.reqs.map((r,i)=>`<div style="margin-bottom:6px">${esc(mem(r.m)?.name)} — ${esc(plan(r.plan).name)} (${plan(r.plan).price}) <button class="g" onclick="viewProof(${r.id})">عرض الإيصال</button> <button class="b" onclick="approve(${i})">موافقة وإصدار فاتورة</button> <button class="g d" onclick="act('reject',{id:S.reqs[${i}].id})">رفض</button></div>`).join(''):'<span class="mut">لا توجد طلبات</span>'}</div>
 <div class="card"><h2>فاتورة جديدة</h2><div class="row"><select id="im">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><select id="ip">${S.plans.map(p=>`<option value="${p.id}">${esc(p.name)} - ${p.price}</option>`).join('')}</select></div><button class="b" onclick="renew($('#im').value,$('#ip').value)">إنشاء فاتورة وتجديد</button></div>
 <div class="card tw"><h2>الفواتير — الإجمالي ${tot}</h2><table><tr><th>#</th><th>العضو</th><th>الباقة</th><th>النوع</th><th>المبلغ</th><th>التاريخ</th><th>طريقة الدفع</th></tr>${[...S.invs].reverse().map(i=>`<tr><td>${i.n}</td><td>${esc(mem(i.m)?.name||i.m)}</td><td>${esc(i.plan)}</td><td>${i.kind}</td><td>${i.amt}</td><td>${i.date}</td><td>${esc(i.pay||'')}</td></tr>`).join('')}</table></div>`;
}
function renew(id,pl){act('renew',{m:id,plan:pl})}
function approve(i){act('approve',{id:S.reqs[i].id})}
function vRep(){
 const soon=S.members.filter(m=>diff(m.end)<=7).sort((a,b)=>a.end.localeCompare(b.end));
 const days=[...Array(7)].map((_,i)=>addD(today(),i-6)),cnt=days.map(d=>S.att.filter(a=>a.in.slice(0,10)===d).length),mx=Math.max(1,...cnt);
 const ren=S.invs.filter(i=>i.kind==='تجديد').length,exp=S.members.filter(m=>diff(m.end)<0).length,rate=ren+exp?Math.round(ren/(ren+exp)*100):0;
 const byPlan={};S.invs.forEach(i=>byPlan[i.plan]=(byPlan[i.plan]||0)+i.amt);
 return `<div class="card tw"><h2>اشتراكات قاربت على الانتهاء / منتهية</h2><table><tr><th>العضو</th><th>الهاتف</th><th>ينتهي</th><th>المتبقي</th></tr>${soon.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${m.end}</td><td class="${diff(m.end)<0?'bad':'warn'}">${diff(m.end)<0?'منتهي':diff(m.end)+' يوم'}</td></tr>`).join('')||'<tr><td>لا يوجد</td></tr>'}</table></div>
 <div class="card"><h2>الحضور آخر 7 أيام</h2><div class="bars">${cnt.map((c,i)=>`<div><i style="height:${c/mx*80}px"></i>${c}<br>${days[i].slice(5)}</div>`).join('')}</div></div>
 <div class="grid"><div class="card"><div class="mut">نسبة التجديد</div><div class="stat">${rate}%</div><div class="mut">${ren} تجديد / ${exp} منتهي دون تجديد</div></div>
 <div class="card"><div class="mut">الإيراد حسب الباقة</div>${Object.entries(byPlan).map(([k,v])=>`<div>${esc(k)}: <b>${v}</b></div>`).join('')}</div></div>`;
}
let err='';
async function login(){const r=await api('login/member',{code:$('#mc').value.trim(),pw:$('#mw').value.trim()});if(r.ok){setTok(r.token);await load();me=S.members[0].id;err='';if(pendingG)await doGate(pendingG)}else err=r.error||'الكود أو كلمة السر غير صحيحة';renderMember()}
function renderMember(){stopMs();
 const m=me&&mem(me);
 if(!m){$('#app').innerHTML=`<main class="mem"><div class="card"><img class="big" src="${LOGO}"><h2>تسجيل دخول المشترك</h2>${pendingG?'<div class="msg warn">سجّل الدخول لإتمام تسجيل دخولك/خروجك للنادي</div>':''}<input id="mc" dir="ltr" placeholder="كود العضو مثل TG-001"><br><br><input id="mw" type="password" dir="ltr" placeholder="كلمة السر"><br><br><button class="b" onclick="login()">دخول</button>${err?`<div class="msg bad">${err}</div>`:''}</div></main>`;return}
 const n=inside(),cw=crowd(n),s=status(m),d=diff(m.end),p=plan(m.plan),tot=Math.max(1,Math.round((new Date(m.end)-new Date(m.start))/864e5)),left=Math.max(0,d)/tot*100;
 $('#app').innerHTML=`<main class="mem">${notesHtml(m)}<div class="card"><div class="mut">${m.id}</div><h2 style="margin:4px 0">${S.mine&&S.mine.inside?'أنت داخل النادي الآن':'أنت خارج النادي'}</h2>${S.mine&&S.mine.inside?`<div class="mut">منذ ${tm(S.mine.since)}</div>`:''}<br><button class="b" onclick="scanGate()">امسح رمز النادي — ${S.mine&&S.mine.inside?'تسجيل خروج':'تسجيل دخول'}</button><div id="mrd" style="max-width:300px;margin:10px auto"></div><div class="mut">أو امسح الرمز المعلّق عند المدخل بكاميرا الجوال العادية</div></div>
 <div class="card"><h2>المتبقي في باقتك</h2><div class="pw">${d>=0?d+' يوم':'منتهي'}</div><div class="meter"><i style="width:${left}%;background:var(--ac)"></i></div><div class="${s[1]}" style="font-weight:700;margin-top:6px">${s[0]}${d<0?' منذ '+(-d)+' يوم':''}</div><div class="mut">من ${m.start} إلى ${m.end}</div></div>
 <div class="card" style="text-align:right"><h2>معلوماتي</h2><div>الاسم: <b>${esc(m.name)}</b></div><div>الهاتف: <b dir="ltr">${esc(m.phone)}</b></div><div>الباقة: <b>${esc(p.name)}</b> <span class="mut">(${esc(p.services)})</span></div><div>السعر: <b>${p.price}</b></div></div>
 <div class="card"><h2>عدد المتواجدين الآن</h2><div class="stat" id="cnum" style="font-size:52px;color:${cw[1]}">${n}</div><div id="cmsg" style="color:${cw[1]};font-weight:700;margin-top:6px">${cw[0]}</div><div class="mut" style="font-size:12px;margin-top:8px">● يتحدّث مباشرة</div></div>
 <div class="card"><h2>طلب تجديد الاشتراك</h2>${S.reqs.some(r=>r.m===m.id)?'<div class="ok">تم إرسال طلبك مع إثبات الدفع، وبانتظار تأكيد الإدارة</div>':`<select id="rp" onchange="payInfo()">${S.plans.map(q=>`<option value="${q.id}" ${q.id===m.plan?'selected':''}>${esc(q.name)} - ${q.price}</option>`).join('')}</select><div id="payinfo" class="mut" style="text-align:right;margin:10px 0"></div><input id="rf" type="file" accept="image/*,application/pdf"><div class="mut">أرفق إشعار التحويل الصادر من شام كاش (صورة أو PDF)</div><br><button class="b" onclick="sendRenew()">إرسال الطلب</button>`}</div>
 <div class="card"><h2>تغيير كلمة السر</h2><input id="po" type="password" dir="ltr" placeholder="كلمة السر الحالية" autocomplete="current-password"><br><br><input id="pn2" type="password" dir="ltr" placeholder="كلمة السر الجديدة (6 خانات على الأقل)" autocomplete="new-password"><br><br><button class="b" onclick="chPw()">تغيير</button></div>
 <div class="card"><h2>للتواصل مع النادي</h2><a href="https://wa.me/963996291519" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px;background:#25d366;color:#08210f;font-weight:700">تواصل عبر واتساب</a><div class="mut" dir="ltr" style="margin-top:6px">+963 996 291 519</div></div>
 <button class="g" onclick="logout()">تسجيل خروج</button></main>`;payInfo();
}
addEventListener('hashchange',route);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{if(TOK&&await load()&&MODE==='member'){me=S.members[0].id;if(pendingG)await doGate(pendingG)}route()})();
setInterval(async()=>{if(!TOK||document.hidden)return;const was=JSON.stringify(S);if(await load()&&JSON.stringify(S)!==was){if(MODE==='member'){if(me)renderMember()}else if(user&&!edit&&ep===null&&!['notes','gate','staff'].includes(tab))route()}},8000);
